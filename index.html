<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="./script.js"></script>
    </head>
    <body class="flex justify-center items-center">
        <div class="w-115 py-2 px-3">
            <h1 class="text-center font-bold text-xl my-2">Virtual Keyboard</h1>
            <textarea name="" id="input" class="w-full outline-1 rounded-md py-1 px-2"></textarea>
            <div>
                <div class="my-2 w-full">
                    <button onclick="clk('q')" class="py-1 px-3 bg-gray-200 rounded-md">q</button>
                    <button onclick="clk('w')" class="py-1 px-3 bg-gray-200 rounded-md">w</button>
                    <button onclick="clk('e')" class="py-1 px-3 bg-gray-200 rounded-md">e</button>
                    <button onclick="clk('r')" class="py-1 px-3 bg-gray-200 rounded-md">r</button>
                    <button onclick="clk('t')" class="py-1 px-3 bg-gray-200 rounded-md">t</button>
                    <button onclick="clk('y')" class="py-1 px-3 bg-gray-200 rounded-md">y</button>
                    <button onclick="clk('u')" class="py-1 px-3 bg-gray-200 rounded-md">u</button>
                    <button onclick="clk('i')" class="py-1 px-3 bg-gray-200 rounded-md">i</button>
                    <button onclick="clk('o')" class="py-1 px-3 bg-gray-200 rounded-md">o</button>
                    <button onclick="clk('p')" class="py-1 px-3 bg-gray-200 rounded-md">p</button>
                </div>
                <div class="my-2 w-full">
                    <button onclick="clk('Tab')" class="py-1 px-3 bg-gray-200 rounded-md">
                        Tab
                    </button>
                    <button onclick="clk('a')" class="py-1 px-3 bg-gray-200 rounded-md">a</button>
                    <button onclick="clk('s')" class="py-1 px-3 bg-gray-200 rounded-md">s</button>
                    <button onclick="clk('d')" class="py-1 px-3 bg-gray-200 rounded-md">d</button>
                    <button onclick="clk('f')" class="py-1 px-3 bg-gray-200 rounded-md">f</button>
                    <button onclick="clk('g')" class="py-1 px-3 bg-gray-200 rounded-md">g</button>
                    <button onclick="clk('h')" class="py-1 px-3 bg-gray-200 rounded-md">h</button>
                    <button onclick="clk('j')" class="py-1 px-3 bg-gray-200 rounded-md">j</button>
                    <button onclick="clk('k')" class="py-1 px-3 bg-gray-200 rounded-md">k</button>
                    <button onclick="clk('l')" class="py-1 px-3 bg-gray-200 rounded-md">l</button>
                    <button onclick="clk('Enter')" class="py-1 px-3 bg-gray-200 rounded-md">
                        Enter
                    </button>
                </div>
                <div class="my-2 w-full">
                    <button onclick="clk('space')" class="py-1 px-3 bg-gray-200 rounded-md">
                        space
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
